# OpenWatch · docker compose
#
#   cp .env.example .env                                  # first time; add any API keys you have
#   docker compose up -d --build                          # core: caddy + frontend + api + collector + redis
#   docker compose pull && docker compose up -d --no-build   # servers: prebuilt images from GHCR
#   docker compose --profile monitoring up -d             # + prometheus, loki, alloy, grafana
#   docker compose logs -f collector                      # JSON logs
#   docker compose down                                   # stop (data stays in ./data)
#
# UI: https://localhost:${OPENWATCH_HTTPS_PORT:-39443}   Grafana: http://localhost:39300 (monitoring profile)
name: openwatch

x-env-common: &env-common
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  REDIS_URL: redis://redis:6379/0
  OPENWATCH_DATA_DIR: /data
  OPENWATCH_SCOPE: ${OPENWATCH_SCOPE:-india}     # india | global (worldwide aircraft, ships, quakes, satellites, news)

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  # ---------------------------------------------------------- web
  caddy:
    image: caddy:2.10-alpine
    depends_on:
      api: { condition: service_started }
      frontend: { condition: service_started }
    ports:
      - "${OPENWATCH_HTTPS_PORT:-39443}:443"
      - "${OPENWATCH_HTTPS_PORT:-39443}:443/udp"   # HTTP/3
      - "${OPENWATCH_HTTP_PORT:-39080}:80"
    environment:
      OPENWATCH_SITE: ${OPENWATCH_SITE:-localhost}   # public name → automatic Let's Encrypt; localhost → internal CA
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                           # certificates: keep across restarts (Let's Encrypt rate limits)
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

  frontend:
    image: ghcr.io/d-rohan-web/openwatch-frontend:${OPENWATCH_TAG:-latest}   # servers pull; `--build` builds locally
    build: ./apps/frontend
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------- app
  api:
    image: ghcr.io/d-rohan-web/openwatch-api:${OPENWATCH_TAG:-latest}
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *env-common
      TOMTOM_KEY: ${TOMTOM_KEY:-}
      OPENWATCH_MAX_EXPORT_DAYS: ${OPENWATCH_MAX_EXPORT_DAYS:-31}
      OPENWATCH_EXPORT_ENABLED: ${OPENWATCH_EXPORT_ENABLED:-false}   # bulk export + archive search (off until paid access)
    volumes:
      - archive:/data:ro          # read-only: only the collector writes the archive
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped
    logging: *logging

  collector:
    image: ghcr.io/d-rohan-web/openwatch-collector:${OPENWATCH_TAG:-latest}
    build: { context: ., dockerfile: apps/collector/Dockerfile }
    env_file: [{ path: .env, required: false }]   # feed API keys (see .env.example)
    environment:
      <<: *env-common
      OPENWATCH_FEEDS: ${OPENWATCH_FEEDS:-}
      OPENWATCH_RETENTION_DAYS: ${OPENWATCH_RETENTION_DAYS:-0}
      OPENWATCH_RAW_RETENTION_DAYS: ${OPENWATCH_RAW_RETENTION_DAYS:-90}
    volumes:
      - archive:/data
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]  # live state only; the archive is the record
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------- monitoring (profile)
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    # Alloy scrapes and pushes here (remote write), the same pipeline that feeds Grafana Cloud on a server
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d", "--web.enable-remote-write-receiver"]
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./infrastructure/monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki:/loki
    restart: unless-stopped

  geoip-init:
    image: alpine:3.20
    profiles: ["monitoring", "cloud"]
    entrypoint: ["/bin/sh", "/fetch.sh"]
    volumes:
      - ./infrastructure/monitoring/geoip/fetch.sh:/fetch.sh:ro
      - geoip:/geoip
    restart: "no"

  # metrics + logs agent. "monitoring" = full local stack; "cloud" = only this agent, shipping to Grafana Cloud
  # (servers: COMPOSE_PROFILES=cloud and the GRAFANA_CLOUD_* values in .env; see docs/monitoring.md)
  alloy:
    image: grafana/alloy:v1.10.2
    profiles: ["monitoring", "cloud"]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    environment:
      OPENWATCH_INSTANCE: ${OPENWATCH_SITE:-local}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/caddy:ro            # Caddy's access log
      - alloy:/var/lib/alloy            # read positions + WAL survive restarts
      - geoip:/geoip:ro                 # DB-IP Lite city database (visitor locations)
      - /proc:/host/proc:ro             # host metrics (CPU, memory, swap, disk, network)
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    depends_on:
      geoip-init: { condition: service_completed_successfully }
    mem_limit: 192m                     # never starve the collector on a 1 GB VM
    restart: unless-stopped
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["monitoring"]
    ports: ["${OPENWATCH_GRAFANA_PORT:-39300}:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus, loki]
    restart: unless-stopped

# Google Cloud's VPC MTU is 1460; Docker assumes 1500, so large TLS handshakes stall inside containers
# (ConnectTimeout to some hosts that the VM itself reaches fine). 1460 is safe on any network.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: "1460"

volumes:
  geoip:
  alloy:
  caddy_data:
  caddy_config:
  archive:                       # the dataset: every record + raw source bytes (back this up)
  prometheus:
  loki:
  grafana:
