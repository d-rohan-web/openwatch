[project]
name = "openwatch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "prometheus-client>=0.26.0",
    "pytz>=2026.6",
    "redis>=8.1.0",
    "selectolax>=1.0.2",
    "sgp4>=2.27",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
