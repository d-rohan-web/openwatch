# AI code review by Claude: inline comments on bugs, leaks and project-rule violations (rules come from CLAUDE.md).
# Needs the ANTHROPIC_API_KEY repository secret and the Claude GitHub App (https://github.com/apps/claude);
# without the secret the job is skipped. Fork PRs get no secrets on `pull_request`, so they're reviewed by
# the other bots and the maintainer (switching to pull_request_target would expose the key to untrusted code).
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    name: Claude review
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: 'echo "::notice::ANTHROPIC_API_KEY not set (or fork PR), so Claude review is skipped."'
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
