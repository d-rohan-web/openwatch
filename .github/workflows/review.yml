# First layer of review on every PR: code quality, security patterns, leaks and AI-code smells.
name: Review bot

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen ruff check --output-format=github .

  checks:
    name: Review checks (AI smells, policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git diff --unified=0 "origin/${{ github.base_ref }}...HEAD" | python3 scripts/ci/review_checks.py

  semgrep:
    name: Security scan (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@v4
      - run: >
          semgrep scan --metrics=off --error --severity ERROR
          --config p/python --config p/typescript --config p/secrets --config p/dockerfile
          --exclude apps/frontend/public --exclude tests/fixtures

  leaks:
    name: Leak scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verified secrets in this PR's commits
        run: >
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:3.90.6
          git file:///repo --since-commit "${{ github.event.pull_request.base.sha }}" --branch HEAD
          --only-verified --fail --no-update
