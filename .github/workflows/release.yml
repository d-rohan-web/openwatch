# Publish images to GHCR on every merge to main, so servers pull instead of building
# (a 1 GB free-tier VM can run out of memory compiling the frontend).
name: Release images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: ., file: apps/api/Dockerfile }
          - { name: bff, context: ., file: apps/bff/Dockerfile }
          - { name: collector, context: ., file: apps/collector/Dockerfile }
          - { name: frontend, context: apps/frontend, file: apps/frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openwatch-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/openwatch-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
