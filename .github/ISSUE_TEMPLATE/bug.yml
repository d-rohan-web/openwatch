name: Bug report
description: Something is broken or wrong on the map
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Include the feed/layer and a screenshot if it's visual. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect? }
  - type: textarea
    id: logs
    attributes: { label: Logs, description: "`docker compose logs collector api` (remove any keys)", render: text }
