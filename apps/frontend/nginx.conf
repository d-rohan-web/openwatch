# static UI. Hashed assets are cached for a year; index.html and /geo are revalidated so a deploy shows at once.
server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # map base layers: served as JSON so Caddy compresses them (nginx would call .geojson octet-stream); ~2.6 MB -> ~0.6 MB
    location /geo/ {
        types { }
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
